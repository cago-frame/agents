[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-service"
version = "0.1.0"
description = "RAG Python microservice for Cago framework"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "tiktoken>=0.7.0",
    "elasticsearch[async]>=8.0.0,<9.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[project.scripts]
rag-service = "rag_service.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
