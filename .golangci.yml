version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - gosec
    - loggercheck
    - makezero
    - misspell
    - nilerr
    - nolintlint
    - prealloc
    - predeclared
    - rowserrcheck
    - staticcheck

  settings:
    gosec:
      excludes:
        - G115
        - G301
        - G302
        - G306
        - G401
        - G402
        - G404
        - G501
        - G505
    misspell:
      locale: US

  exclusions:
    # Phase 1 of the agent API redesign keeps the Legacy* event/hook/error
    # types alive (intentionally marked Deprecated) so the goagent and
    # claudecode backends can continue to compile while the new Event /
    # HookContext types are introduced. Phase 2/3 migrates these backends and
    # Phase 5 rewrites the examples; until then suppress SA1019 in the files
    # that knowingly consume the deprecated symbols.
    rules:
      - linters:
          - staticcheck
        text: "SA1019:.*(Legacy(Event|HookStage|HookContext|HookFunc|HookError)|EventMeta|IterationStartEvent|ContentDeltaEvent|ThinkingDeltaEvent|ThinkingEndEvent|ToolCallStartEvent|ToolCallEndEvent|MessageEndEvent|DoneEvent|ErrorEvent)"
        paths:
          - agent/claudecode/.*
          - agent/goagent/.*
          - example/.*

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 10m
